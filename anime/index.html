<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#140d2a" />
    <meta name="robots" content="noindex" />
    <title>Anime</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23c86bff'/%3E%3Ccircle cx='12' cy='14' r='2.5' fill='%23fff'/%3E%3Ccircle cx='20' cy='14' r='2.5' fill='%23fff'/%3E%3C/svg%3E" />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: linear-gradient(180deg, #1b1445, #3a1f52 60%, #6b2f5e) fixed;
        color: #f3e9ff;
        font: 17px/1.4 ui-rounded, 'SF Pro Rounded', 'Nunito', system-ui, sans-serif;
      }
      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: max(28px, env(safe-area-inset-top)) 22px 32px;
      }
      .back {
        color: #b9a6d9;
        font-weight: 700;
        text-decoration: none;
      }
      h1 {
        margin: 6px 0 22px;
        font-size: 1.6rem;
        font-weight: 800;
        background: linear-gradient(90deg, #ffb866, #ff5d7d, #c86bff);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      figure {
        margin: 0;
      }
      video {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        border-radius: 16px;
        background: #000;
        box-shadow: 0 14px 40px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.12);
      }
      figcaption {
        margin: 12px 4px 0;
        font-weight: 700;
        font-size: 1.1rem;
      }
      figcaption span {
        color: #b9a6d9;
        font-weight: 400;
      }
      footer {
        margin-top: 36px;
        color: #b9a6d9;
        font-size: 0.85rem;
      }
      footer a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <main>
      <a class="back" href="../">← Alle Videos</a>
      <h1>Anime</h1>
      <figure>
        <video src="issen.mp4" poster="issen.webp" controls preload="none" playsinline></video>
        <figcaption>一閃 · Issen <span>· 20 Sekunden, komplett in Code gezeichnet</span></figcaption>
      </figure>
      <footer>Stimme: <a href="https://elevenlabs.io">ElevenLabs</a></footer>
    </main>
  </body>
</html>
