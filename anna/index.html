<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fde7f3" />
    <meta name="robots" content="noindex" />
    <title>KI für Anna</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23c86bff'/%3E%3Ccircle cx='12' cy='14' r='2.5' fill='%23fff'/%3E%3Ccircle cx='20' cy='14' r='2.5' fill='%23fff'/%3E%3C/svg%3E" />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: linear-gradient(180deg, #ffe4f2, #e6d9ff) fixed;
        color: #3b2a4a;
        font: 17px/1.4 ui-rounded, 'SF Pro Rounded', 'Nunito', system-ui, sans-serif;
      }
      main {
        max-width: 1180px;
        margin: 0 auto;
        padding: max(28px, env(safe-area-inset-top)) 22px 32px;
      }
      h1 {
        margin: 6px 0 22px;
        font-size: 1.6rem;
        font-weight: 800;
        background: linear-gradient(90deg, #ff5d7d, #ff9f45, #c86bff, #7f7cff);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .episodes {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 26px;
      }
      figure {
        margin: 0;
      }
      video {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        border-radius: 20px;
        background: #f4eefc;
        box-shadow: 0 10px 30px rgba(120, 70, 160, 0.25), 0 0 0 4px #fff;
      }
      figcaption {
        margin: 12px 4px 0;
        font-weight: 700;
        font-size: 1.1rem;
      }
      footer {
        margin-top: 36px;
        color: #8a7aa3;
        font-size: 0.85rem;
      }
      .back {
        color: #8a7aa3;
        font-weight: 700;
        text-decoration: none;
      }
      footer a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <main>
      <a class="back" href="../">← Alle Videos</a>
      <h1>KI für Anna</h1>
      <div class="episodes">
        <figure>
          <video src="episode1.mp4" poster="posters/episode1.webp" controls preload="none" playsinline></video>
          <figcaption>1 · Was ist KI?</figcaption>
        </figure>
        <figure>
          <video src="episode2.mp4" poster="posters/episode2.webp" controls preload="none" playsinline></video>
          <figcaption>2 · Wie KI lernt</figcaption>
        </figure>
        <figure>
          <video src="episode3.mp4" poster="posters/episode3.webp" controls preload="none" playsinline></video>
          <figcaption>3 · KI und wir</figcaption>
        </figure>
        <figure>
          <video src="episode4.mp4" poster="posters/episode4.webp" controls preload="none" playsinline></video>
          <figcaption>4 · Wie die Filme entstanden sind</figcaption>
        </figure>
      </div>
      <footer>Stimme und Klänge: <a href="https://elevenlabs.io">ElevenLabs</a></footer>
    </main>
    <script>
      // Only one video plays at a time.
      document.querySelectorAll("video").forEach((v) =>
        v.addEventListener("play", () => document.querySelectorAll("video").forEach((o) => o !== v && o.pause())),
      );
    </script>
  </body>
</html>
